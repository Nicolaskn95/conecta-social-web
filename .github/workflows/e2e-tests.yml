name: Testes E2E (Robot Framework)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Filtrar por Tag (ex: smoke, publico, auth, regressivo) - vazio roda tudo"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  e2e-tests:
    name: Executar Testes E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: testes_automatizados/requirements.txt

      - name: Configurar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar Dependências do Robot Framework
        run: |
          python -m pip install --upgrade pip
          pip install -r testes_automatizados/requirements.txt

      - name: Executar Suíte Robot Framework
        id: robot
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TEST_TAG: ${{ inputs.tag }}
        run: |
          cd testes_automatizados
          mkdir -p results

          ROBOT_ARGS="--outputdir results"

          if [ -n "$TEST_TAG" ]; then
            ROBOT_ARGS="$ROBOT_ARGS --include $TEST_TAG"
          fi

          if [ -n "$ADMIN_EMAIL" ]; then
            ROBOT_ARGS="$ROBOT_ARGS --variable ADMIN_EMAIL:$ADMIN_EMAIL"
          fi

          if [ -n "$ADMIN_PASSWORD" ]; then
            ROBOT_ARGS="$ROBOT_ARGS --variable ADMIN_PASSWORD:$ADMIN_PASSWORD"
          fi

          python -m robot $ROBOT_ARGS tests

      - name: Preparar index.html para o GitHub Pages
        if: always()
        run: |
          if [ -f "testes_automatizados/results/report.html" ]; then
            cp testes_automatizados/results/report.html testes_automatizados/results/index.html
          fi

      - name: Publicar Relatórios como Artifact (.zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-results
          path: testes_automatizados/results/
          retention-days: 15

      - name: Configurar GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Empacotar Relatório para o GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: testes_automatizados/results/

      - name: Resumo de Execução dos Testes
        if: always()
        run: |
          echo "## 🧪 Resultado dos Testes Automatizados (Robot Framework)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.robot.outcome }}" == "success" ]; then
            echo "✅ **Status:** Todos os testes executados passaram com sucesso!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Um ou mais testes falharam. Verifique o relatório HTML detalhado." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Download Offline:** Baixe o pacote \`robot-test-results\` na seção **Artifacts** desta execução." >> $GITHUB_STEP_SUMMARY

  publish-pages:
    name: Publicar Relatório no GitHub Pages
    if: always() && github.event_name != 'pull_request'
    needs: e2e-tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Link do Relatório Online no Summary
        if: always()
        run: |
          echo "## 🌐 Relatório HTML Publicado no GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 **[Abrir Relatório Geral (report.html)](${{ steps.deployment.outputs.page_url }}report.html)**" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 **[Abrir Log Detalhado (log.html)](${{ steps.deployment.outputs.page_url }}log.html)**" >> $GITHUB_STEP_SUMMARY

